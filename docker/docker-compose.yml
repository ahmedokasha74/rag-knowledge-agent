services:
  neo4j:
    image: neo4j:5-community
    container_name: graphrag_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP - Neo4j Browser
      - "7687:7687"   # Bolt - driver connections
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - graphrag_neo4j_data:/data
      - graphrag_neo4j_logs:/logs

volumes:
  graphrag_neo4j_data:
  graphrag_neo4j_logs:
